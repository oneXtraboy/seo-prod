<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">Как выбрать формат работы</title>
  <desc id="desc">Четыре состояния проекта сопоставлены с аудитом, спринтом, ежемесячным ростом и экспертной поддержкой.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ea"/>
      <stop offset="1" stop-color="#f1faf6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1d1d1f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#18745d"/>
    </marker>
    <style>
      .heading{font:700 28px/1.2 ui-rounded,system-ui,sans-serif;fill:#1d1d1f}
      .condition{font:600 20px/1.3 system-ui,sans-serif;fill:#3a3a3c}
      .format{font:700 23px/1.2 ui-rounded,system-ui,sans-serif;fill:#1d1d1f}
      .hint{font:500 17px/1.3 system-ui,sans-serif;fill:#6e6e73}
    </style>
  </defs>
  <rect width="720" height="700" rx="32" fill="url(#bg)"/>
  <text x="360" y="60" text-anchor="middle" class="heading">Что нужно проекту сейчас?</text>
  <g filter="url(#shadow)">
    <rect x="35" y="105" width="300" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="405" y="105" width="280" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="35" y="250" width="300" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="405" y="250" width="280" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="35" y="395" width="300" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="405" y="395" width="280" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="35" y="540" width="300" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
    <rect x="405" y="540" width="280" height="110" rx="20" fill="#fff" stroke="#d2d2d7"/>
  </g>
  <text x="65" y="150" class="condition">Нет ясной картины</text>
  <text x="65" y="180" class="hint">Нужна диагностика</text>
  <path d="M345 160H389" stroke="#18745d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="435" y="170" class="format">Аудит</text>
  <text x="65" y="295" class="condition">Одна критичная зона</text>
  <text x="65" y="325" class="hint">Нужен ограниченный цикл</text>
  <path d="M345 305H389" stroke="#18745d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="435" y="315" class="format">Спринт</text>
  <text x="65" y="440" class="condition">Нужен стабильный рост</text>
  <text x="65" y="470" class="hint">Работа продолжается циклами</text>
  <path d="M345 450H389" stroke="#18745d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="435" y="445" class="format">Ежемесячный</text>
  <text x="435" y="475" class="format">рост</text>
  <text x="65" y="585" class="condition">Внутри уже есть команда</text>
  <text x="65" y="615" class="hint">Нужен внешний контроль</text>
  <path d="M345 595H389" stroke="#18745d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="435" y="590" class="format">Экспертная</text>
  <text x="435" y="620" class="format">поддержка</text>
</svg>
