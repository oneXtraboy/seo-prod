services:
  audit-api:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: synapsee-audit-api
    restart: unless-stopped
    entrypoint: ["node", "/app/server.js"]
    ports:
      - "127.0.0.1:5680:5680"
    environment:
      - PORT=5680
      - AUDIT_ALLOWED_ORIGIN=https://synapsee.ru
      - AUDIT_HASH_SECRET=${AUDIT_HASH_SECRET}
      - AUDIT_DATA_DIR=/data
      - TELEGRAM_BOT_TOKEN=${SEO_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${SEO_TELEGRAM_USER_ID}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AUDIT_NOTIFY_EMAIL=${AUDIT_NOTIFY_EMAIL:-1extraboy@gmail.com}
      - AUDIT_FROM_EMAIL=${AUDIT_FROM_EMAIL:-Synapsee <onboarding@resend.dev>}
    volumes:
      - ./audit-api:/app:ro
      - ./audit-data:/data

